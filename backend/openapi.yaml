{
  "openapi": "3.0.3",
  "info": {
    "title": "Global Multi-Entity ERP API",
    "version": "0.4.0",
    "description": "API contract for global multi-entity accounting endpoints under /api/v1.",
    "license": {
      "name": "MIT",
      "url": "https://opensource.org/licenses/MIT"
    }
  },
  "servers": [
    {
      "url": "https://api.global-ledger.com",
      "description": "Production"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Org",
      "description": "Organization hierarchy and fiscal structure management."
    },
    {
      "name": "Security",
      "description": "Role and permission assignment APIs."
    },
    {
      "name": "GL",
      "description": "General ledger setup and journal workflows."
    },
    {
      "name": "FX",
      "description": "Foreign exchange rate management."
    },
    {
      "name": "Cari",
      "description": "Cari (AR/AP) documents, settlements, bank links, and reporting endpoints."
    },
    {
      "name": "Contracts",
      "description": "Contract lifecycle, line management, and document-link workflows."
    },
    {
      "name": "RevenueRecognition",
      "description": "Revenue recognition schedule, run, accrual, and reporting endpoints."
    },
    {
      "name": "Intercompany",
      "description": "Intercompany relationship and reconciliation endpoints."
    },
    {
      "name": "Consolidation",
      "description": "Consolidation setup, runs, and report endpoints."
    },
    {
      "name": "Onboarding",
      "description": "Tenant/company bootstrap flow endpoints."
    },
    {
      "name": "Inventory",
      "description": "Warehouse, stock-link materialization, valuation, and inventory movement endpoints."
    },
    {
      "name": "Items",
      "description": "Item-card master data endpoints used by CARI and inventory flows."
    },
    {
      "name": "Approvals",
      "description": "Unified approval policy and approval request engine endpoints (Bank + Payroll)."
    },
    {
      "name": "Bank",
      "description": "Bank account, statements, reconciliation, and payment-file workflows."
    },
    {
      "name": "Cash",
      "description": "Cash register, session, transaction, and exception workflows."
    },
    {
      "name": "Exceptions",
      "description": "Unified exception workbench endpoints across bank and payroll operations."
    },
    {
      "name": "Jobs",
      "description": "Background jobs, retries, and operational queue management endpoints."
    },
    {
      "name": "Ops",
      "description": "Operational dashboards for KPI, SLA, and pipeline health summaries."
    },
    {
      "name": "Payments",
      "description": "Generic payment batch workflows (create, approve, export, post, cancel)."
    },
    {
      "name": "Payroll",
      "description": "Payroll import runs and payroll subledger workflow endpoints."
    },
    {
      "name": "Provider",
      "description": "Provider control-plane administration endpoints."
    },
    {
      "name": "System",
      "description": "System health and operational endpoints."
    },
    {
      "name": "Auth",
      "description": "Session and identity endpoints."
    }
  ],
