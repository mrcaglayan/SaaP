    },
    {
      "name": "GL",
      "description": "General ledger setup and journal workflows."
    },
    {
      "name": "FX",
      "description": "Foreign exchange rate management."
    },
    {
      "name": "Cari",
      "description": "Cari (AR/AP) documents, settlements, bank links, and reporting endpoints."
    },
    {
      "name": "Intercompany",
      "description": "Intercompany relationship and reconciliation endpoints."
    },
    {
      "name": "Consolidation",
      "description": "Consolidation setup, runs, and report endpoints."
    },
    {
      "name": "Onboarding",
      "description": "Tenant/company bootstrap flow endpoints."
    },
    {
      "name": "Cash",
      "description": "Cash register, session, transaction, and exception workflows."
    },
    {
      "name": "Provider",
      "description": "Provider control-plane administration endpoints."
    },
    {
      "name": "Auth",
      "description": "Session and identity endpoints."
    },
    {
      "name": "System",
      "description": "System health and operational endpoints."
